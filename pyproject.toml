[project]
name = "rfp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atik", email = "rahman.atawur@findit.id" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.1",
    "apscheduler>=3.11.3",
    "bcrypt==4.0.1",
    "beautifulsoup4==4.12.3",
    "fastapi==0.111.0",
    "httpx==0.27.0",
    "openai>=1.40.0",
    "passlib[bcrypt]==1.7.4",
    "playwright==1.44.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.3",
    "pydantic-settings==2.3.1",
    "pypdf2==3.0.1",
    "pytest==8.2.2",
    "python-docx==1.1.2",
    "python-jose[cryptography]==3.3.0",
    "redis==5.0.4",
    "sqlalchemy==2.0.30",
    "uvicorn==0.30.1",
    "pgvector>=0.2.1",
    "sentence-transformers>=2.7.0",
    "google-genai>=1.2.0",
]

[project.scripts]
rfp = "rfp:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

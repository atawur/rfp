  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8050 --reload
    ports:
      - "8050:8050"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_started

